[project]
name = "evaris"
version = "0.1.0"
description = "Trace-based evaluation for AI agents"
requires-python = ">=3.11"
dependencies = [
    "etrace-py[otel]>=0.1.0",
    "langchain>=1.3.4",
    "langchain-core>=1.4.1",
    "langchain-openai>=1.2.2",
    "openai>=2.41.0",
    "python-dotenv>=1.2.2",
    "gepa>=0.1.1",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
]

[project.scripts]
evaris = "evaris.cli:main"
chameleon = "evaris.cli:main"

[project.optional-dependencies]
etrace = ["etrace-py[otel]>=0.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaris"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/langchain-gaia-agent/agent.py" = ["B008"]
"examples/workflow.py" = ["E402"]

[tool.ty.environment]
python = "./.venv"
python-platform = "macos"

[dependency-groups]
dev = [
    "ruff>=0.15.16",
    "ty>=0.0.44",
]
